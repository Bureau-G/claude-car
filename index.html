<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto Assistent">
<meta name="theme-color" content="#0a0a0f">
<title>Auto Assistent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f; --surface:#13131a; --surface2:#1c1c26;
    --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
    --accent:#4f8ef7; --accent2:#7c5cfc; --green:#3de8a0;
    --amber:#f5a623; --red:#f05050;
    --text:#f0f0f5; --text2:#8888aa; --text3:#55556a;
    --radius:14px; --radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;}
  #app{height:100%;display:flex;flex-direction:column;}

  .header{padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:15px;}
  .logo-text{font-size:17px;font-weight:800;letter-spacing:-0.02em;}
  .logo-text span{color:var(--accent);}
  .session-chip{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);padding:4px 10px;border-radius:20px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .screen{flex:1;overflow-y:auto;display:none;flex-direction:column;}
  .screen.active{display:flex;}

  #setup{padding:20px;gap:14px;}
  .setup-title{font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1.2;}
  .setup-title span{color:var(--accent);}
  .setup-sub{font-size:13px;color:var(--text2);line-height:1.6;}
  .field-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:7px;}
  .field-group{display:flex;flex-direction:column;}
  input[type=text],input[type=password]{background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:11px 13px;border-radius:var(--radius-sm);outline:none;width:100%;transition:border-color 0.2s;}
  input:focus{border-color:var(--accent);}
  input::placeholder{color:var(--text3);}
  .session-list{display:flex;flex-direction:column;gap:7px;}
  .sess-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
  .sess-item:hover,.sess-item.selected{border-color:var(--accent);background:rgba(79,142,247,0.08);}
  .sess-name{font-size:14px;font-weight:600;}
  .sess-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);margin-top:2px;}
  .sess-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px;transition:color 0.15s;flex-shrink:0;}
  .sess-del:hover{color:var(--red);}
  .new-sess-row{display:flex;gap:8px;}
  .new-sess-row input{flex:1;}
  .btn{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;padding:11px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
  .btn-accent{background:var(--accent);color:white;}
  .btn-accent:hover{background:#3a7de8;}
  .btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface);color:var(--text);}
  .btn-start{width:100%;padding:15px;font-size:15px;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;font-family:'Syne',sans-serif;font-weight:800;cursor:pointer;transition:opacity 0.15s,transform 0.1s;}
  .btn-start:active{transform:scale(0.98);}
  .btn-start:disabled{opacity:0.3;cursor:not-allowed;}
  .btn-kenn{width:100%;padding:12px;font-size:14px;border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);border:1px solid var(--border2);font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;transition:all 0.15s;}
  .btn-kenn:hover{border-color:var(--green);color:var(--green);}
  .divider{height:1px;background:var(--border);flex-shrink:0;}
  .profiel-box{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;line-height:1.9;display:none;}

  #chat{padding:0;}
  .chat-messages{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:9px;}
  .msg{padding:10px 13px;border-radius:var(--radius-sm);font-size:14px;line-height:1.65;max-width:90%;animation:fadeUp 0.2s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
  .msg.user{background:linear-gradient(135deg,rgba(79,142,247,0.18),rgba(124,92,252,0.12));border:1px solid rgba(79,142,247,0.25);color:var(--text);align-self:flex-end;}
  .msg.assistant{background:var(--surface);border:1px solid var(--border);color:var(--text);align-self:flex-start;}
  .msg.system{background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);color:var(--amber);align-self:center;font-size:12px;font-family:'DM Mono',monospace;text-align:center;border-radius:20px;padding:5px 13px;max-width:100%;}

  .mic-panel{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:16px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:11px;}
  .badge-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .badge{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}
  .badge.green{color:var(--green);border-color:rgba(61,232,160,0.3);background:rgba(61,232,160,0.06);}
  .mic-outer{position:relative;width:78px;height:78px;display:flex;align-items:center;justify-content:center;}
  .mic-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;transition:border-color 0.3s;}
  .mic-inner{width:64px;height:64px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:background 0.2s,transform 0.1s;position:relative;z-index:1;user-select:none;}
  .mic-inner:active{transform:scale(0.94);}
  .s-idle .mic-ring{border-color:transparent;}
  .s-listening .mic-ring{border-color:var(--accent);animation:spin 2s linear infinite;}
  .s-listening .mic-inner{background:rgba(79,142,247,0.12);}
  .s-awake .mic-ring{border-color:var(--green);animation:pulse 1s ease-in-out infinite;}
  .s-awake .mic-inner{background:rgba(61,232,160,0.12);}
  .s-buffering .mic-ring{border-color:var(--amber);animation:pulse 0.7s ease-in-out infinite;}
  .s-buffering .mic-inner{background:rgba(245,166,35,0.12);}
  .s-thinking .mic-ring{border-color:var(--accent2);animation:spin 1s linear infinite;}
  .s-thinking .mic-inner{background:rgba(124,92,252,0.12);}
  .s-speaking .mic-ring{border-color:var(--accent2);animation:pulse 0.8s ease-in-out infinite;}
  .s-speaking .mic-inner{background:rgba(124,92,252,0.15);}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.07);opacity:0.7;}}
  .mic-status{font-size:13px;color:var(--text2);text-align:center;min-height:18px;max-width:280px;line-height:1.4;}
  .mic-status.on{color:var(--text);}
  .bottom-row{display:flex;gap:8px;width:100%;max-width:320px;}
  .bottom-row button{flex:1;font-size:13px;padding:9px 12px;}
  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;}
  .empty-icon{font-size:38px;opacity:0.25;}
  .empty-text{font-size:13px;color:var(--text3);text-align:center;line-height:1.7;}
  ::-webkit-scrollbar{width:3px;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🚗</div>
      <div class="logo-text">Auto <span>Assistent</span></div>
    </div>
    <div class="session-chip" id="hdr-sess">Geen sessie</div>
  </div>

  <div class="screen active" id="setup">
    <div class="setup-title">Jouw rijdende<br><span>AI-assistent</span></div>
    <div class="setup-sub">Zeg "Hallo Auto Assistent" → spreek → sluit af met "Verwerk deze input".</div>
    <div class="field-group">
      <div class="field-label">API-sleutel</div>
      <input type="password" id="api-input" placeholder="sk-ant-..." autocomplete="off"/>
    </div>
    <div class="divider"></div>
    <div class="field-group">
      <div class="field-label">Sessies</div>
      <div class="session-list" id="sess-list"></div>
    </div>
    <div class="field-group">
      <div class="field-label">Nieuwe sessie</div>
      <div class="new-sess-row">
        <input type="text" id="new-sess-input" placeholder="Beschrijf je idee..."/>
        <button class="btn btn-accent" id="btn-add">+</button>
      </div>
    </div>
    <button class="btn-start" id="btn-start" disabled>Rijden maar →</button>
    <div class="divider"></div>
    <div class="field-group">
      <div class="field-label">Kennismaking & Profiel</div>
      <button class="btn-kenn" id="btn-kenn">🤝 Start kennismakingsgesprek</button>
    </div>
    <div class="field-group" id="profiel-group" style="display:none">
      <div class="field-label">Jouw profiel</div>
      <div class="profiel-box" id="profiel-box"></div>
    </div>
  </div>

  <div class="screen" id="chat">
    <div class="chat-messages" id="messages"></div>
    <div class="mic-panel">
      <div class="badge-row">
        <div class="badge">Wake: "Hallo Auto Assistent"</div>
        <div class="badge green">Stop: "Verwerk deze input"</div>
      </div>
      <div class="mic-outer s-idle" id="mic-outer">
        <div class="mic-ring"></div>
        <div class="mic-inner" id="mic-btn">🎙️</div>
      </div>
      <div class="mic-status" id="mic-status">Tik op de microfoon om te starten</div>
      <div class="bottom-row">
        <button class="btn btn-ghost" id="btn-back">← Terug</button>
        <button class="btn btn-ghost" id="btn-clear">Wis chat</button>
      </div>
    </div>
  </div>
</div>

<script>
const MODEL = 'claude-haiku-4-5-20251001';
const STORE = 'autoassistent_v3';
const WAKE = 'hallo auto assistent';
const WAKE_ALTS = ['hallo auto','hallo assistent','auto assistent'];
const STOPWOORD = 'verwerk deze input';
const STOP_ALTS = ['verwerk input','verwerk dit','verwerk mijn input','verwerk ze','roger','roger dat','klaar met input','einde input','dat was het'];
const SLUITWOORDEN = ['doei','tot ziens','afsluiten','einde sessie','gesprek beeindigen','stop het gesprek'];

let state = JSON.parse(localStorage.getItem(STORE)||'{"sessions":[],"apiKey":"","profiel":{}}');
let sess=null, rec=null;
let isAwake=false, isProc=false, isListen=false, inConv=false;
let buf=[], waitTmr=null;

const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// DOM refs
const apiEl=document.getElementById('api-input');
const sessListEl=document.getElementById('sess-list');
const newSessEl=document.getElementById('new-sess-input');
const btnAdd=document.getElementById('btn-add');
const btnStart=document.getElementById('btn-start');
const btnKenn=document.getElementById('btn-kenn');
const profielGrp=document.getElementById('profiel-group');
const profielBox=document.getElementById('profiel-box');
const hdrSess=document.getElementById('hdr-sess');
const messagesEl=document.getElementById('messages');
const micOuter=document.getElementById('mic-outer');
const micBtnEl=document.getElementById('mic-btn');
const micStat=document.getElementById('mic-status');
const btnBack=document.getElementById('btn-back');
const btnClear=document.getElementById('btn-clear');

if(state.apiKey) apiEl.value=state.apiKey;
apiEl.addEventListener('input',()=>{state.apiKey=apiEl.value.trim();save();checkReady();});
const checkReady=()=>btnStart.disabled=!(state.apiKey&&sess);

function renderSessions(){
  if(!state.sessions.length){sessListEl.innerHTML='<div style="font-size:13px;color:var(--text3);padding:8px 0;">Nog geen sessies. Maak er een aan.</div>';return;}
  sessListEl.innerHTML='';
  [...state.sessions].reverse().forEach(s=>{
    const d=document.createElement('div');
    d.className='sess-item'+(sess?.id===s.id?' selected':'');
    const n=s.messages.filter(m=>m.role==='user').length;
    d.innerHTML=`<div><div class="sess-name">${esc(s.name)}</div><div class="sess-meta">${n} berichten · ${new Date(s.id).toLocaleDateString('nl-NL')}</div></div><button class="sess-del" title="Verwijder">✕</button>`;
    d.addEventListener('click',e=>{if(e.target.classList.contains('sess-del'))return;sess=s;renderSessions();checkReady();});
    d.querySelector('.sess-del').addEventListener('click',e=>{e.stopPropagation();state.sessions=state.sessions.filter(x=>x.id!==s.id);if(sess?.id===s.id)sess=null;save();renderSessions();checkReady();});
    sessListEl.appendChild(d);
  });
}

function renderProfiel(){
  const entries=Object.entries(state.profiel);
  if(!entries.length){profielGrp.style.display='none';return;}
  profielGrp.style.display='flex';profielBox.style.display='block';
  profielBox.innerHTML=entries.map(([k,v])=>`<b>${esc(k)}:</b> ${esc(v)}`).join('<br>');
}

btnAdd.addEventListener('click',()=>{
  const name=newSessEl.value.trim()||'Idee '+(state.sessions.length+1);
  const s={id:Date.now(),name,messages:[]};
  state.sessions.push(s);sess=s;newSessEl.value='';
  save();renderSessions();checkReady();
});
newSessEl.addEventListener('keydown',e=>{if(e.key==='Enter')btnAdd.click();});
btnStart.addEventListener('click',()=>{state.apiKey=apiEl.value.trim();save();startChat();});
btnKenn.addEventListener('click',()=>{
  if(!state.apiKey){alert('Voer eerst je API-sleutel in.');return;}
  const s={id:Date.now(),name:'🤝 Kennismaking',messages:[],isKennismaking:true};
  state.sessions.push(s);sess=s;save();startChat();
  setTimeout(()=>{isAwake=true;inConv=true;processInput('[START]');},900);
});
btnBack.addEventListener('click',()=>{stopAll();showScreen('setup');renderSessions();renderProfiel();});
btnClear.addEventListener('click',()=>{if(sess){sess.messages=[];save();renderMessages();}});
micBtnEl.addEventListener('click',()=>{if(!isListen&&!isProc)startRec();});

function showScreen(id){
  document.getElementById('setup').classList.toggle('active',id==='setup');
  document.getElementById('chat').classList.toggle('active',id==='chat');
}
function startChat(){
  hdrSess.textContent=sess.name;showScreen('chat');renderMessages();
  setMic('idle');micStat.textContent='Tik op de microfoon om te starten';
}
function renderMessages(){
  messagesEl.innerHTML='';
  if(!sess?.messages.length){messagesEl.innerHTML='<div class="empty-state"><div class="empty-icon">🎙️</div><div class="empty-text">Zeg "Hallo Auto Assistent" om te beginnen,<br>of tik op de microfoon.</div></div>';return;}
  sess.messages.forEach(m=>addMsg(m.role,m.content,false));
}
function addMsg(role,text,anim=true){
  messagesEl.querySelectorAll('.empty-state').forEach(e=>e.remove());
  const d=document.createElement('div');d.className='msg '+role;
  if(!anim)d.style.animation='none';d.textContent=text;
  messagesEl.appendChild(d);messagesEl.scrollTop=messagesEl.scrollHeight;
}
function setMic(s){
  micOuter.className='mic-outer s-'+s;
  const icons={idle:'🎙️',listening:'👂',awake:'✨',buffering:'📝',thinking:'⏳',speaking:'🔊'};
  micBtnEl.textContent=icons[s]||'🎙️';
}

// ── SPRAAKHERKENNING ──
function startRec(){
  if(isProc)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micStat.textContent='Gebruik Chrome voor spraakherkenning.';return;}
  rec=new SR();rec.lang='nl-NL';rec.continuous=false;rec.interimResults=false;isListen=true;

  rec.onstart=()=>{
    isListen=true;
    if(inConv&&buf.length>0){setMic('buffering');micStat.textContent='📝 Buffer actief — zeg "Verwerk deze input" als je klaar bent';}
    else if(inConv){setMic('awake');micStat.textContent='Luisteren... zeg "Verwerk deze input" als je klaar bent';}
    else{setMic('listening');micStat.textContent='Zeg "Hallo Auto Assistent"...';}
    micStat.className='mic-status on';
  };

  rec.onresult=e=>{
    const raw=e.results[0][0].transcript.trim();
    const t=raw.toLowerCase();
    isListen=false;clearWT();

    // Wake word
    if(!isAwake&&!inConv){
      if(t.includes(WAKE)||WAKE_ALTS.some(w=>t.includes(w))){
        isAwake=true;inConv=true;buf=[];setMic('awake');
        speak('Ja, ik luister. Spreek je bericht en zeg "Verwerk deze input" als je klaar bent.',()=>startRec());
      }else{setTimeout(()=>startRec(),400);}
      return;
    }

    // Sluitwoord
    if(SLUITWOORDEN.some(w=>t.includes(w))){
      buf=[];inConv=false;isAwake=false;
      speak('Oké, tot de volgende keer! Rij veilig.',()=>{setMic('listening');micStat.textContent='Zeg "Hallo Auto Assistent" om opnieuw te starten';startRec();});
      return;
    }

    // Stopwoord
    const heeftStop=t.includes(STOPWOORD)||STOP_ALTS.some(w=>t.includes(w));
    if(heeftStop){
      let schoon=raw;
      [STOPWOORD,...STOP_ALTS].forEach(w=>{schoon=schoon.replace(new RegExp(w,'gi'),'').trim();});
      if(schoon)buf.push(schoon);
      const vol=buf.join(' ').trim();buf=[];
      if(vol){processInput(vol);}else{speak('Je bericht was leeg. Wat wil je zeggen?',()=>startRec());}
      return;
    }

    // Normaal fragment → buffer
    if(raw)buf.push(raw);
    const prev=buf.join(' ');
    micStat.textContent='📝 "'+(prev.length>50?prev.slice(0,50)+'...':prev)+'" — zeg "Verwerk deze input"';
    startWT();startRec();
  };

  rec.onerror=e=>{
    isListen=false;
    if(e.error==='not-allowed'){micStat.textContent='Geef microfoon-toegang in Chrome-instellingen';setMic('idle');return;}
    if(!isProc)setTimeout(()=>startRec(),600);
  };
  rec.onend=()=>{isListen=false;if(!isProc)setTimeout(()=>startRec(),300);};
  try{rec.start();}catch(e){}
}

function stopAll(){
  if(rec){try{rec.abort();}catch(e){}rec=null;}
  window.speechSynthesis.cancel();
  isAwake=false;isProc=false;isListen=false;inConv=false;buf=[];clearWT();setMic('idle');
}

// ── 5-SEC TIMER ──
function startWT(){
  clearWT();
  waitTmr=setTimeout(()=>{
    if(!inConv||isProc||!buf.length)return;
    if(rec){try{rec.abort();}catch(e){}rec=null;}isListen=false;
    speak('Moet ik je input nu verwerken, of wil je nog iets toevoegen?',()=>luisterBevestiging());
  },5000);
}
function clearWT(){if(waitTmr){clearTimeout(waitTmr);waitTmr=null;}}

function luisterBevestiging(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  const r=new SR();r.lang='nl-NL';r.continuous=false;r.interimResults=false;
  setMic('awake');micStat.textContent='Verwerken of doorgaan?';
  r.onresult=e=>{
    const t=e.results[0][0].transcript.toLowerCase().trim();
    const ja=['ja','verwerk','klopt','correct','doe maar','graag','yes'].some(w=>t.includes(w));
    if(ja){const v=buf.join(' ').trim();buf=[];if(v)processInput(v);else speak('Geen input. Ga verder.',()=>startRec());}
    else{speak('Oké, ga verder. Zeg "Verwerk deze input" als je klaar bent.',()=>startRec());}
  };
  r.onerror=()=>startRec();r.onend=()=>{};
  try{r.start();}catch(e){}
}

// ── TEKST-NAAR-SPRAAK ──
function speak(text,cb){
  window.speechSynthesis.cancel();setMic('speaking');micStat.textContent='Assistent antwoordt...';
  const utt=new SpeechSynthesisUtterance(text);utt.lang='nl-NL';utt.rate=1.0;utt.pitch=1.0;
  const v=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('nl'));if(v)utt.voice=v;
  utt.onend=utt.onerror=()=>{if(cb)cb();};window.speechSynthesis.speak(utt);
}

// ── CLAUDE API ──
async function processInput(rawText){
  isProc=true;clearWT();setMic('thinking');micStat.textContent='Nadenken...';
  const isStart=rawText==='[START]';
  if(!isStart){sess.messages.push({role:'user',content:rawText});addMsg('user',rawText);save();}

  const profTekst=Object.keys(state.profiel).length
    ?'\n\nBekende info over de gebruiker:\n'+Object.entries(state.profiel).map(([k,v])=>`- ${k}: ${v}`).join('\n'):'';

  const sys=sess.isKennismaking
    ?`Je bent een vriendelijke persoonlijke assistent in de auto. Je taak is de gebruiker goed leren kennen via een natuurlijk gesprek. Stel één gerichte persoonlijke vraag tegelijk over werk, hobby's, gezin, ambities, gewoontes, communicatiestijl. Stel doorvragende vervolgvragen op basis van de antwoorden. Spreek altijd vloeiend Nederlands. Geen opsommingstekens. Korte, gesproken antwoorden. Als de gebruiker [START] stuurt, stel je jezelf kort voor en stel je de eerste vraag.${profTekst}`
    :`Je bent een slimme persoonlijke assistent voor in de auto. Spreek altijd vloeiend Nederlands. Je voert een natuurlijk gesprek. Antwoorden zijn kort en geschikt voor gesproken taal — maximaal 3 zinnen tenzij meer gevraagd. Geen opsommingstekens. Je helpt met ideeën, plannen, vragen en taken. Huidige sessie: "${sess.name}".${profTekst}`;

  const msgs=isStart?[{role:'user',content:'[START]'}]:sess.messages;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':state.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL,max_tokens:350,system:sys,messages:msgs})
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const reply=data.content?.[0]?.text||'Sorry, geen antwoord.';
    sess.messages.push({role:'assistant',content:reply});addMsg('assistant',reply);save();
    if(sess.isKennismaking)updateProfiel(sess.messages);
    isProc=false;buf=[];
    speak(reply,()=>{setMic('awake');micStat.textContent='Luisteren... zeg "Verwerk deze input" als je klaar bent';startRec();});
  }catch(err){
    addMsg('system','Fout: '+(err.message||'Controleer je API-sleutel.'));
    isProc=false;isAwake=false;inConv=false;setMic('idle');micStat.textContent='Er ging iets mis. Tik om opnieuw te proberen.';
  }
}

// ── PROFIEL BIJWERKEN ──
async function updateProfiel(msgs){
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':state.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL,max_tokens:400,system:'Analyseer dit gesprek en extraheer feitelijke persoonlijke informatie over de gebruiker. Geef ALLEEN een geldig JSON object terug. Voorbeeld: {"naam":"Jan","werk":"ondernemer","woonplaats":"Hardenberg","hobby":"fietsen"}. Alleen bevestigde feiten. Geen aannames. Alleen JSON, niets anders.',messages:msgs.slice(-20)})
    });
    const data=await res.json();
    const txt=data.content?.[0]?.text||'{}';
    const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
    state.profiel={...state.profiel,...parsed};save();
  }catch(e){console.log('Profiel update mislukt:',e);}
}

// ── INIT ──
renderSessions();renderProfiel();checkReady();
window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
window.speechSynthesis.getVoices();
</script>

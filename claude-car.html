<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Car">
<meta name="theme-color" content="#0a0a0f">
<title>Claude Car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --green: #3de8a0;
    --amber: #f5a623;
    --red: #f05050;
    --text: #f0f0f5;
    --text2: #8888aa;
    --text3: #55556a;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; }

  #app { height: 100%; display: flex; flex-direction: column; }

  /* HEADER */
  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .logo-text span { color: var(--accent); }
  .session-chip {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text2);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 20px;
    max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* SCREENS */
  .screen { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* SETUP SCREEN */
  #setup { padding: 24px 20px; gap: 16px; }
  .setup-title { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
  .setup-title span { color: var(--accent); }
  .setup-sub { font-size: 14px; color: var(--text2); line-height: 1.6; }

  .field-label {
    font-size: 11px; font-weight: 600; color: var(--text3);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
  }
  .field-group { display: flex; flex-direction: column; }

  input[type=text], input[type=password] {
    background: var(--surface); border: 1px solid var(--border2);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px;
    padding: 12px 14px; border-radius: var(--radius-sm);
    outline: none; width: 100%;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text3); }

  .session-list { display: flex; flex-direction: column; gap: 8px; }
  .sess-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .sess-item:hover, .sess-item.selected { border-color: var(--accent); background: rgba(79,142,247,0.08); }
  .sess-name { font-size: 14px; font-weight: 600; }
  .sess-meta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); margin-top: 2px; }
  .sess-del {
    background: none; border: none; color: var(--text3); cursor: pointer;
    font-size: 16px; padding: 4px 6px; border-radius: 6px;
    transition: color 0.15s, background 0.15s; flex-shrink: 0;
  }
  .sess-del:hover { color: var(--red); background: rgba(240,80,80,0.1); }

  .new-sess-row { display: flex; gap: 8px; }
  .new-sess-row input { flex: 1; }

  .btn {
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px;
    padding: 12px 20px; border-radius: var(--radius-sm); border: none;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: #3a7de8; }
  .btn-accent:disabled { background: var(--surface2); color: var(--text3); cursor: not-allowed; }
  .btn-ghost { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface); color: var(--text); }

  .btn-start {
    width: 100%; padding: 16px; font-size: 16px; border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; font-family: 'Syne', sans-serif; font-weight: 800;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  .btn-start:active { transform: scale(0.98); }
  .btn-start:disabled { opacity: 0.3; cursor: not-allowed; }

  .divider { height: 1px; background: var(--border); }

  /* CHAT SCREEN */
  #chat { padding: 0; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px 16px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    padding: 11px 14px; border-radius: var(--radius-sm);
    font-size: 14px; line-height: 1.65; max-width: 88%;
    animation: fadeUp 0.2s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .msg.user {
    background: linear-gradient(135deg, rgba(79,142,247,0.18), rgba(124,92,252,0.12));
    border: 1px solid rgba(79,142,247,0.25);
    color: var(--text); align-self: flex-end;
  }
  .msg.assistant {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); align-self: flex-start;
  }
  .msg.system {
    background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.2);
    color: var(--amber); align-self: center; font-size: 12px;
    font-family: 'DM Mono', monospace; text-align: center;
    border-radius: 20px; padding: 6px 14px; max-width: 100%;
  }

  /* MIC PANEL */
  .mic-panel {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 20px 20px 32px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .wake-label {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 20px; letter-spacing: 0.04em;
  }
  .mic-outer {
    position: relative;
    width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
  }
  .mic-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.3s;
  }
  .mic-btn-inner {
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    position: relative; z-index: 1;
  }
  .mic-btn-inner:active { transform: scale(0.95); }

  /* States */
  .mic-state-idle .mic-ring { border-color: transparent; }
  .mic-state-idle .mic-btn-inner { background: var(--surface2); }

  .mic-state-listening .mic-ring { border-color: var(--accent); animation: spinRing 2s linear infinite; }
  .mic-state-listening .mic-btn-inner { background: rgba(79,142,247,0.15); }

  .mic-state-awake .mic-ring { border-color: var(--green); animation: pulse 1s ease-in-out infinite; }
  .mic-state-awake .mic-btn-inner { background: rgba(61,232,160,0.15); }

  .mic-state-thinking .mic-ring { border-color: var(--amber); animation: spinRing 1s linear infinite; }
  .mic-state-thinking .mic-btn-inner { background: rgba(245,166,35,0.12); }

  .mic-state-speaking .mic-ring { border-color: var(--accent2); animation: pulse 0.8s ease-in-out infinite; }
  .mic-state-speaking .mic-btn-inner { background: rgba(124,92,252,0.15); }

  @keyframes spinRing { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.08); opacity:0.7; } }

  .mic-status { font-size: 13px; color: var(--text2); text-align: center; min-height: 18px; }
  .mic-status.active { color: var(--text); }

  .bottom-row {
    display: flex; gap: 10px; width: 100%; max-width: 340px;
  }
  .bottom-row button { flex: 1; }

  /* API warning */
  .warning-box {
    background: rgba(240,80,80,0.08); border: 1px solid rgba(240,80,80,0.25);
    border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 13px; color: #f07070; line-height: 1.6;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; }
  .empty-icon { font-size: 40px; opacity: 0.3; }
  .empty-text { font-size: 13px; color: var(--text3); text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🚗</div>
      <div class="logo-text">Claude <span>Car</span></div>
    </div>
    <div class="session-chip" id="header-session">Geen sessie</div>
  </div>

  <!-- SETUP SCREEN -->
  <div class="screen active" id="setup">
    <div class="setup-title">Jouw rijdende<br><span>AI-assistent</span></div>
    <div class="setup-sub">Zeg "Hallo Claude Car" en bespreek je ideeën handsfree terwijl je rijdt.</div>

    <div class="field-group">
      <div class="field-label">Anthropic API-sleutel</div>
      <input type="password" id="api-input" placeholder="sk-ant-..." autocomplete="off" />
    </div>

    <div class="divider"></div>

    <div class="field-group">
      <div class="field-label">Sessies</div>
      <div class="session-list" id="sess-list">
        <div class="empty-state" style="padding:16px 0;">
          <div class="empty-text">Nog geen sessies.<br>Maak hieronder een nieuwe aan.</div>
        </div>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">Nieuwe sessie</div>
      <div class="new-sess-row">
        <input type="text" id="new-sess-input" placeholder="Beschrijf je idee..." />
        <button class="btn btn-accent" id="btn-add">+</button>
      </div>
    </div>

    <button class="btn-start" id="btn-start" disabled>Rijden maar →</button>
  </div>

  <!-- CHAT SCREEN -->
  <div class="screen" id="chat">
    <div class="chat-messages" id="messages"></div>
    <div class="mic-panel">
      <div class="wake-label">Activeringswoord: "Hallo Claude Car"</div>
      <div class="mic-outer mic-state-idle" id="mic-outer">
        <div class="mic-ring"></div>
        <div class="mic-btn-inner" id="mic-btn">🎙️</div>
      </div>
      <div class="mic-status" id="mic-status">Tik om te starten</div>
      <div class="bottom-row">
        <button class="btn btn-ghost" id="btn-back">← Terug</button>
        <button class="btn btn-ghost" id="btn-clear">Wis chat</button>
      </div>
    </div>
  </div>
</div>

<script>
const WAKE = 'hallo claude car';
const MODEL = 'claude-haiku-4-5-20251001';
const STORE = 'claudecar_v2';

let state = JSON.parse(localStorage.getItem(STORE) || '{"sessions":[],"apiKey":""}');
let currentSess = null;
let recognition = null;
let isAwake = false;
let isProcessing = false;
let isListening = false;

function save() { localStorage.setItem(STORE, JSON.stringify(state)); }

// --- SETUP ---
const apiInput = document.getElementById('api-input');
const sessList = document.getElementById('sess-list');
const newSessInput = document.getElementById('new-sess-input');
const btnAdd = document.getElementById('btn-add');
const btnStart = document.getElementById('btn-start');
const headerSession = document.getElementById('header-session');

if (state.apiKey) apiInput.value = state.apiKey;

apiInput.addEventListener('input', () => {
  state.apiKey = apiInput.value.trim();
  save(); checkReady();
});

function checkReady() {
  btnStart.disabled = !(state.apiKey && currentSess);
}

function renderSessions() {
  if (state.sessions.length === 0) {
    sessList.innerHTML = '<div class="empty-state" style="padding:16px 0;"><div class="empty-text">Nog geen sessies.<br>Maak hieronder een nieuwe aan.</div></div>';
    return;
  }
  sessList.innerHTML = '';
  [...state.sessions].reverse().forEach(s => {
    const div = document.createElement('div');
    div.className = 'sess-item' + (currentSess && currentSess.id === s.id ? ' selected' : '');
    const count = s.messages.filter(m => m.role === 'user').length;
    div.innerHTML = `
      <div>
        <div class="sess-name">${esc(s.name)}</div>
        <div class="sess-meta">${count} berichten · ${new Date(s.id).toLocaleDateString('nl-NL')}</div>
      </div>
      <button class="sess-del" data-id="${s.id}" title="Verwijder">✕</button>`;
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('sess-del')) return;
      currentSess = s; renderSessions(); checkReady();
    });
    div.querySelector('.sess-del').addEventListener('click', (e) => {
      e.stopPropagation();
      state.sessions = state.sessions.filter(x => x.id !== s.id);
      if (currentSess && currentSess.id === s.id) { currentSess = null; }
      save(); renderSessions(); checkReady();
    });
    sessList.appendChild(div);
  });
}

btnAdd.addEventListener('click', () => {
  const name = newSessInput.value.trim() || 'Idee ' + (state.sessions.length + 1);
  const s = { id: Date.now(), name, messages: [] };
  state.sessions.push(s);
  currentSess = s;
  newSessInput.value = '';
  save(); renderSessions(); checkReady();
});

newSessInput.addEventListener('keydown', e => { if (e.key === 'Enter') btnAdd.click(); });

btnStart.addEventListener('click', () => {
  state.apiKey = apiInput.value.trim();
  save();
  showChat();
});

// --- CHAT ---
const messagesEl = document.getElementById('messages');
const micOuter = document.getElementById('mic-outer');
const micBtn = document.getElementById('mic-btn');
const micStatus = document.getElementById('mic-status');
const btnBack = document.getElementById('btn-back');
const btnClear = document.getElementById('btn-clear');

btnBack.addEventListener('click', () => {
  stopAll();
  document.getElementById('chat').classList.remove('active');
  document.getElementById('setup').classList.add('active');
  renderSessions();
});

btnClear.addEventListener('click', () => {
  if (currentSess) { currentSess.messages = []; save(); renderMessages(); }
});

micBtn.addEventListener('click', () => {
  if (!isListening && !isProcessing) startRecognition();
});

function showChat() {
  document.getElementById('setup').classList.remove('active');
  document.getElementById('chat').classList.add('active');
  headerSession.textContent = currentSess.name;
  renderMessages();
  setMicState('idle');
  micStatus.textContent = 'Tik op de microfoon om te starten';
}

function renderMessages() {
  messagesEl.innerHTML = '';
  if (!currentSess || currentSess.messages.length === 0) {
    messagesEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🎙️</div><div class="empty-text">Zeg "Hallo Claude Car" om te beginnen,<br>of tik op de microfoon.</div></div>';
    return;
  }
  currentSess.messages.forEach(m => addBubble(m.role, m.content, false));
}

function addBubble(role, text, animate = true) {
  const empties = messagesEl.querySelectorAll('.empty-state');
  empties.forEach(e => e.remove());
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (!animate) div.style.animation = 'none';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setMicState(s) {
  micOuter.className = 'mic-outer mic-state-' + s;
  const icons = { idle:'🎙️', listening:'👂', awake:'✨', thinking:'⏳', speaking:'🔊' };
  micBtn.textContent = icons[s] || '🎙️';
}

// --- SPEECH ---
function startRecognition() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    micStatus.textContent = 'Spraakherkenning niet beschikbaar. Gebruik Chrome.';
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'nl-NL';
  recognition.continuous = false;
  recognition.interimResults = false;
  isListening = true;

  recognition.onstart = () => {
    setMicState(isAwake ? 'awake' : 'listening');
    micStatus.textContent = isAwake ? 'Luisteren... spreek je bericht' : 'Luisteren naar "Hallo Claude Car"...';
    micStatus.className = 'mic-status active';
  };

  recognition.onresult = (e) => {
    const t = e.results[0][0].transcript.toLowerCase().trim();
    isListening = false;
    if (!isAwake) {
      if (t.includes('hallo claude') || t.includes('claude car') || t.includes(WAKE)) {
        isAwake = true;
        setMicState('awake');
        speak('Ja, ik luister. Wat wil je bespreken?', () => startRecognition());
      } else {
        setMicState('idle');
        micStatus.textContent = 'Zeg "Hallo Claude Car" of tik opnieuw';
        micStatus.className = 'mic-status';
        setTimeout(() => startRecognition(), 400);
      }
    } else {
      handleUserInput(e.results[0][0].transcript.trim());
    }
  };

  recognition.onerror = (e) => {
    isListening = false;
    if (e.error === 'not-allowed') {
      micStatus.textContent = 'Geef microfoon-toegang in Chrome-instellingen';
      setMicState('idle'); return;
    }
    if (!isProcessing) setTimeout(() => startRecognition(), 500);
  };

  recognition.onend = () => {
    isListening = false;
    if (!isProcessing) setTimeout(() => startRecognition(), 300);
  };

  try { recognition.start(); } catch(e) {}
}

function stopAll() {
  if (recognition) { try { recognition.abort(); } catch(e){} recognition = null; }
  window.speechSynthesis.cancel();
  isAwake = false; isProcessing = false; isListening = false;
  setMicState('idle');
}

function speak(text, cb) {
  window.speechSynthesis.cancel();
  setMicState('speaking');
  micStatus.textContent = 'Claude antwoordt...';
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'nl-NL'; utt.rate = 1.0; utt.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const nlVoice = voices.find(v => v.lang.startsWith('nl'));
  if (nlVoice) utt.voice = nlVoice;
  utt.onend = utt.onerror = () => { if (cb) cb(); };
  window.speechSynthesis.speak(utt);
}

async function handleUserInput(text) {
  isProcessing = true;
  setMicState('thinking');
  micStatus.textContent = 'Nadenken...';

  currentSess.messages.push({ role: 'user', content: text });
  addBubble('user', text);
  save();

  const sysPrompt = `Je bent Claude Car, een vriendelijke en slimme spraakassistent voor in de auto. Je spreekt altijd Nederlands. Houd antwoorden kort en geschikt voor gesproken taal — maximaal 3 zinnen, tenzij de gebruiker meer detail vraagt. Geen opsommingstekens of opmaak. Wees direct en bondig. Huidige sessie: "${currentSess.name}".`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 300,
        system: sysPrompt,
        messages: currentSess.messages
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const reply = data.content?.[0]?.text || 'Sorry, ik kon geen antwoord genereren.';

    currentSess.messages.push({ role: 'assistant', content: reply });
    addBubble('assistant', reply);
    save();

    isProcessing = false;
    speak(reply, () => {
      isAwake = false;
      setMicState('listening');
      micStatus.textContent = 'Luisteren naar "Hallo Claude Car"...';
      startRecognition();
    });

  } catch (err) {
    const msg = 'Fout: ' + (err.message || 'Controleer je API-sleutel en verbinding.');
    addBubble('system', msg);
    isProcessing = false; isAwake = false;
    setMicState('idle');
    micStatus.textContent = 'Er ging iets mis. Tik om opnieuw te proberen.';
    micStatus.className = 'mic-status';
  }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Init
renderSessions();
checkReady();

// Preload voices
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
window.speechSynthesis.getVoices();
</script>
</body>
</html>
